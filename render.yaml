services:
  - type: web
    name: madx-hybrid-studio
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: API_ACCESS_TOKEN
        sync: false
      - key: ADMIN_ACCESS_TOKEN
        sync: false
      - key: ADMIN_SESSION_HOURS
        value: "8"
      - key: REQUIRE_LOGIN
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ALLOWED_LOGIN_EMAILS
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: SESSION_ENCRYPTION_KEY
        sync: false
      - key: SESSION_DAYS
        value: "30"
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: MADX_FREE_EDITION
        value: "true"
      - key: MADX_DISABLE_FALLBACK
        value: "true"
      - key: FREE_FALLBACK_MODEL
        value: ""
      - key: PAID_FALLBACK_MODEL
        value: ""
      - key: MADX_DATA_DIR
        value: "/tmp/madx-data"
      - key: MADX_DEFAULT_MODEL
        sync: false
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: PROVIDER_REQUEST_TIMEOUT
        value: "60"
      - key: RATE_LIMIT_PER_MIN
        value: "30"
      - key: TRUST_PROXY
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_MODELS_TOKEN
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        value: ""
      - key: OLLAMA_API_KEY
        sync: false
      - key: LITELLM_BASE_URL
        sync: false
      - key: LITELLM_API_KEY
        sync: false
      - key: LITELLM_MODELS
        value: ""
      - key: OMNIROUTE_BASE_URL
        sync: false
      - key: OMNIROUTE_API_KEY
        sync: false
      - key: OMNIROUTE_MODELS
        value: ""
      - key: PAWANOSMAN_BASE_URL
        sync: false
      - key: PAWANOSMAN_API_KEY
        sync: false
      - key: PAWANOSMAN_MODELS
        value: "default"
      - key: NINE_ROUTER_BASE_URL
        sync: false
      - key: NINE_ROUTER_API_KEY
        sync: false
      - key: NINE_ROUTER_MODELS
        value: "default"
      - key: NEW_API_BASE_URL
        sync: false
      - key: NEW_API_API_KEY
        sync: false
      - key: NEW_API_MODELS
        value: "default"
      - key: ONE_API_BASE_URL
        sync: false
      - key: ONE_API_API_KEY
        sync: false
      - key: ONE_API_MODELS
        value: "default"
